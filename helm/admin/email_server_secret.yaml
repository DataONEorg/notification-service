## Create a basic-auth secret to access the SMTP server
##
######################################################################################
#     D O   N O T   C H E C K   C R E D E N T I A L S   I N T O   G I T H U B ! ! !
######################################################################################
#
# Edit this file to add your ${RELEASE_NAME} and credentials, then install it in your cluster
#
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  #######################################################################
  ##  EDIT THIS TO SUBSTITUTE YOUR RELEASE NAME, IF IT'S NOT "ns" ! ! !
  #######################################################################
  name: ${RELEASE_NAME}-notify-cnpg

## @param stringData write-only, non-binary secret data (eg credentials) in string form.
##
## # # #    NEVER CHECK SECRETS INTO GITHUB!   # # #
##
stringData:
  username: "notifications_user"
  password: "$PASSWORD"
