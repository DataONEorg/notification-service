apiVersion: v1
kind: Service
metadata:
  name: ns-messages
  labels:
    {{- include "notifications.labels" . | nindent 4 }}
spec:
  type: {{ .Values.nsMessagesService.type }}
  ports:
    - port: {{ .Values.nsMessagesService.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "notifications.selectorLabels" . | nindent 4 }}
