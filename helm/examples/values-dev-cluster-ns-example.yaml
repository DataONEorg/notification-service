## override values.yaml with values to use for running on the NCEAS dev cluster
##
## example:
##
##  helm upgrade --install ns --debug -n notifications \
##                          -f ./helm/examples/values-dev-cluster-ns-example.yaml \
##                          oci://ghcr.io/dataoneorg/charts/notifications --version [version]
##
## ...or to install from local helm chart code, replace:
##   oci://ghcr.io/dataoneorg/charts/notifications --version [version]
## with:
##   ./helm
##
## see values.yaml for full documentation on the following parameters
##

ns:
  logLevel: debug
  auth:
    api:
      baseUrl: https://cn-sandbox.test.dataone.org/cn/v2
      connectTimeoutMilliSec: 10000
      readTimeoutMilliSec: 20000

  ## Assuming your CNPG helm release name is 'nsdb':
  database:
    jdbcHost: nsdb-cnpg-rw
    existingSecret: nsdb-cnpg-app

image:
  tag: develop
  pullPolicy: Always

tomcat:
  jmxEnabled: true
  remoteDebugEnabled: true
  remoteDebugPort: 5005

ingress:
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: &hostname notifications.test.dataone.org
      paths:
        - path: /
          pathType: Prefix
        - path: /notifications/v1/private
          pathType: Prefix
          backend:
            serviceName: dev-null-service
            servicePort: 8080
  tls:
    - hosts:
        - *hostname
      secretName: ingress-tls-cert

nsconsumer:
  image:
    tag: develop
    pullPolicy: Always

  email:
    # @param nsconsumer.email.host The hostname of the SMTP server to use for sending emails.
    host: nsmailpit
    # @param nsconsumer.email.port The port of the SMTP server to use for sending emails.
    port: 1025
    # @section nsconsumer.email.auth Configuration for SMTP authentication.
    auth:
      # @param nsconsumer.email.auth.enabled Enable or disable SMTP authentication.
      enabled: true
      # @param nsconsumer.email.auth.existingSecret Secret holding SMTP credentials. This won't be
      # created automatically if you don't provide one, so you have to either
      # create it manually or via some other chart. The mailpit chart creates it automatically,
      # and then you can just supply the name.
      existingSecret: "nsmailpit-auth"
    accountSvc:
      ## @param nsconsumer.email.accountSvc.url The full URL for querying the account service API
      ## in order to obtain the email address for a given subject. This is typically the CN account
      ## service API, and includes the ?query= parameter; e.g.
      ##   url: https://cn-sandbox.test.dataone.org/cn/v2/accounts?query=
      ##
      url: https://cn-sandbox.test.dataone.org/cn/v2/accounts?query=

rmq:
  rmqOperator:
    persistence:
      storageClassName: "csi-cephfs-sc-ephemeral"
