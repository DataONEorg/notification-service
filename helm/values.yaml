## @section Tomcat Configuration
tomcat:
  ## @param tomcat.extraCatalinaOpts Extra JVM options to pass to Tomcat. SEE IMPORTANT NOTES BELOW:
  ## 1. Do not set JMX-related values here, without first checking they're not already defined in
  ##    tomcat.jmxCatalinaOpts (assuming tomcat.jmxEnabled is true)
  ## 2. You can also set -Xms and/or -Xmx here, but it is safer to set -XX:MaxRAMPercentage instead
  ## 3. Note that -XX:MaxRAMPercentage will be ignored by the JVM if you also set a value for -Xmx
  ##    (i.e. -Xmx takes precedence over MaxRAMPercentage)
  ##
  ## (extraCatalinaOpts is a yaml list, so each entry must be preceded by a dash (-) and a space. It
  ## looks strange when the options also contain dashes, but is correct YAML syntax.)
  ##
  extraCatalinaOpts:
    - -XX:MaxRAMPercentage=75

  ## @param tomcat.jmxEnabled Enable JMX for Tomcat, to inspect JVM usage of CPU, memory, etc.
  ## When JMX is enabled by setting this to 'true', you can view the JMX metrics using a JMX client
  ## such as VisualVM or JConsole, connected via port-forwarding to the port set in tomcat.jmxPort
  ##
  jmxEnabled: false

  ## @param tomcat.jmxPort The port to use for JMX connections. IMPORTANT: If you change this...
  ## 1. you must also change the port in the tomcat.jmxCatalinaOpts section, in the following two
  ##    entries:
  ##     -Dcom.sun.management.jmxremote.port=9010
  ##     -Dcom.sun.management.jmxremote.rmi.port=9010
  ##
  ## 2. If you plan on using a different port # on localhost, it's easiest to use that same port on
  ##    the pod, so you're using a single port for both JMX and RMI.(e.g. instead of port
  ##    forwarding from pod:9010 to localhost:9011, expose jmx on pod:9011 and forward from pod:9011
  ##    to localhost:9011)
  ##
  ## Note that the JMX port is not (and should not be) exposed outside the cluster. It is therefore
  ## necessary to use port-forwarding in order to connect.
  ##
  jmxPort: 9010

  ## @param tomcat.jmxCatalinaOpts [default: see values.yaml] Tomcat JVM options for enabling JMX
  ## Use these to change the port, for example, or to enable authentication.
  ##
  ## IMPORTANT NOTES:
  ## 1. If you change the port numbers here, you must also change the value of tomcat.jmxPort to
  ##    match!
  ## 2. If you plan on using a different port # on localhost, it's easiest to use that same port on
  ##    the pod, so you're using a single port for both JMX and RMI.(e.g. instead of port
  ##    forwarding from pod:9010 to localhost:9011, expose jmx on pod:9011 and forward from pod:9011
  ##    to localhost:9011)
  ##
  ## (jmxCatalinaOpts is a yaml list, so each entry must be preceded by a dash (-) and a space. It
  ## looks strange when the options also contain dashes, but is correct YAML syntax.)
  ##
  jmxCatalinaOpts:
    - -Dcom.sun.management.jmxremote
    - -Dcom.sun.management.jmxremote.port=9010
    - -Dcom.sun.management.jmxremote.rmi.port=9010
    - -Dcom.sun.management.jmxremote.local.only=false
    - -Dcom.sun.management.jmxremote.authenticate=false
    - -Dcom.sun.management.jmxremote.ssl=false
    - -Djava.rmi.server.hostname=127.0.0.1

  ## @param tomcat.remoteDebugEnabled Enable remote debugging for Tomcat
  ##
  remoteDebugEnabled: false

  ## @param tomcat.remoteDebugPort The port to use for remote debugging connections
  ##
  remoteDebugPort: 5005

## @Section Default values for nsconsumer subchart
nsconsumer:

  ## @param nsconsumer.replicaCount The number of replicas for the nsconsumer deployment
  ##
  replicaCount: 1

  ## @param nsconsumer.nameOverride String to partially override the nsconsumer chart name
  ##
  nameOverride: ""

  ## @param nsconsumer.fullNameOverride String to fully override the nsconsumer resource names
  ##
  fullNameOverride: ""

  image:
    ## @param nsconsumer.image.repository The nsconsumer image repository
    ##
    repository: ghcr.io/dataoneorg/nsconsumer

    ## @param nsconsumer.image.pullPolicy The nsconsumer image pull policy
    ##
    pullPolicy: IfNotPresent


  ## Resource requests and limits for the notification consumer deployment
  resources:
    requests:
      ## @param nsconsumer.resources.requests.cpu CPU requested for the nsconsumer container
      ##
      cpu: 100m
      ## @param nsconsumer.resources.requests.memory Memory requested for the nsconsumer container
      ##
      memory: 128Mi
    limits:
      ## @param nsconsumer.resources.limits.cpu Maximum CPU the nsconsumer container may use
      ##
      cpu: 200m
      ## @param nsconsumer.resources.limits.memory Maximum memory the nsconsumer container may use
      ##
      memory: 256Mi

  serviceAccount:
    ## @param nsconsumer.serviceAccount.create Should a service account be created for nsconsumer?
    ##
    create: false
    ## @param nsconsumer.serviceAccount.name The name of the service account to use for nsconsumer
    ##
    name: ""

  ## @param nsconsumer.readinessProbe.enabled Enable the readinessProbe for the nsconsumer container
  ## @param nsconsumer.readinessProbe.exec.command The command that checks the consumer's readiness file is fresh (<30s old)
  ## @param nsconsumer.readinessProbe.initialDelaySeconds Seconds to wait after container start before probing
  ## @param nsconsumer.readinessProbe.periodSeconds How often (in seconds) to perform the probe
  ## @param nsconsumer.readinessProbe.timeoutSeconds Seconds after which the probe times out
  ##
  readinessProbe:
    enabled: true
    exec:
      command:
        - /bin/sh
        - -c
        - test $(($(date +%s) - $(stat -c %Y /tmp/rmq-consumer-readiness))) -lt 30
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5

  ## @param nsconsumer.livenessProbe.enabled Enable the livenessProbe for the nsconsumer container
  ## @param nsconsumer.livenessProbe.exec.command The command that checks the consumer's readiness file is fresh (<30s old)
  ## @param nsconsumer.livenessProbe.initialDelaySeconds Seconds to wait after container start before probing
  ## @param nsconsumer.livenessProbe.periodSeconds How often (in seconds) to perform the probe
  ## @param nsconsumer.livenessProbe.timeoutSeconds Seconds after which the probe times out
  ##
  livenessProbe:
    enabled: true
    exec:
      command:
      - /bin/sh
      - -c
      - test $(($(date +%s) - $(stat -c %Y /tmp/rmq-consumer-readiness))) -lt 30
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 5

  ## @param nsconsumer.extraEnvVars Optional additional env vars to be added to the container.
  ## Format:
  ## extraEnvVars:
  ##   EXAMPLE_ENV_VAR: "example_value_1"
  ##   EXAMPLE_ENV_VAR_2: "example_value_2"
  extraEnvVars: {}

## @section Configuration for the SMTP server used to send email notifications
emailUtil:
  ## @param emailUtil.host The hostname of the SMTP server to use for sending emails.
  host: ADD_HOST
  ## @param emailUtil.port The port of the SMTP server to use for sending emails.
  port: 1025
  auth:
    ## @param emailUtil.auth.enabled Enable or disable SMTP authentication.
    enabled: true
    ## @param emailUtil.auth.existingSecret Secret holding SMTP credentials. This won't be
    ## created automatically if you don't provide one, so you have to either
    ## create it manually or reference a secret created by the email service chart.
    ##
    existingSecret: ""

## @section RabbitMQ Connection Configuration
## (This section does NOT affect the RabbitMQ Operator installation itself.)
## These settings are used to configure the connection from the nsconsumer app to an existing
## RabbitMQ instance; either the instance deployed by the RabbitMQ Cluster Operator using the YAML
## template in this chart, or an alternative provided nby the user.
##
rmq:
  rmqConnection:
    ## @param rmq.rmqConnection.existingSecret Name of Secret holding RMQ credentials (REQUIRED)
    ##
    existingSecret: "ns-rmq-4-1-3-default-user"
    ## TODO: autopopulate if not provided

    ## @param rmq.rmqConnection.hostname RMQ hostname (REQUIRED)
    ##
    hostname: "ns-rmq-4-1-3" # TODO: autopopulate if not provided

    ## @param rmq.rmqConnection.port RMQ amqp port
    ##
    port: "5672"

    ## @param rmq.rmqConnection.virtualHost RMQ virtual host
    ##
    virtualHost: "/"

    ## @param rmq.rmqConnection.queueName RMQ queue name
    ##
    queueName: "dataone.notifications"

    ## @param rmq.rmqConnection.prefetchCount RMQ prefetch count
    ## This is the number of messages that the consumer will prefetch from the queue before
    ## acknowledging them. A higher prefetch count can improve throughput, but may also increase
    ## memory usage and latency. The optimal value depends on the workload and the consumer's
    ## processing speed.
    ##
    prefetchCount: 25

    ## @param rmq.rmqConnection.username The username needed for rabbitmq access.
    ##
    username: ""  # TODO: autopopulate if not provided

    ## @param rmq.rmqConnection.rmqUserKey key for rabbitmq username in existing secret
    ##
    rmqUserKey: "username"

    ## @param rmq.rmqConnection.rmqPasswordKey key for rabbitmq password in existing secret
    ##
    rmqPasswordKey: "password"


  ## @section RabbitMQ Operator Configuration
  ## For a production example of a multi-zone Kubernetes deployment with 3 worker nodes, each in a
  ## different zone, see:
  ## https://github.com/rabbitmq/cluster-operator/tree/main/docs/examples/production-ready
  ##
  rmqOperator:
    ## @param rmq.rmqOperator.enabled Enable or disable the RabbitMQ Operator installation
    ##
    enabled: true

    ## @param rmq.rmqOperator.nameOverride REQUIRED partial override for resourcename used for pods, PVCs etc
    ## Automatically prepends the release name, so the resulting resource name for the pods etc. will
    ## begin:  <myrelease>-<rabbitmq.nameOverride>-...
    ##
    ## We change this with every change in RabbitMQ app version, so that we can use a new PV/PVC for
    ## each release. This means each new installation is a fresh install, instead of being an upgrade,
    ## which would be a lot more onerous (see rabbitMQ docs).
    ##
    ## Convention is to use 'rmq', followed by the rabbitmq app version, with periods replaced by
    ## dashes; e.g.:
    ##  nameOverride: "rmq-4-1-3"  ## for rabbitmq app version 4.1.3
    ##
    nameOverride: "rmq-4-1-3"

    ## @param rmq.rmqOperator.replicaCount Number of desired rabbitmq pods (always use an odd number)
    ## see: https://www.rabbitmq.com/docs/clustering#node-count
    ##
    replicaCount: 1

    ## Resource requests and limits for rabbitmq pods (OVERRIDE THESE!)
    ##
    ## NOTE:
    ##   CPU: For production, the ABSOLUTE MINIMUM is 2 CPUs per RabbitMQ node (and 4 CPUs
    ##        RECOMMENDED).
    ##        RMQ will work poorly with 1 CPU, which is why it's not recommended for production
    ##        workloads
    ##   MEMORY: For production, min. 2GB of RAM is recommended, increasing to 4Gi or even 8 - 10Gi,
    ##        depending on load. It is recommended to keep the memory requests and limits both at
    ##        the same value.
    ##
    resources:
      requests:
        ## @param rmq.rmqOperator.resources.requests.cpu CPU requested for the nsconsumer
        ##
        cpu: 400m
        ## @param rmq.rmqOperator.resources.requests.memory Memory requested for the nsconsumer
        ##
        memory: 500Mi

      limits:
        ## @param rmq.rmqOperator.resources.limits.cpu Maximum CPU the nsconsumer may use
        ##
        cpu: 900m
        ## @param rmq.rmqOperator.resources.limits.memory Maximum memory the nsconsumer may use
        ##
        memory: 500Mi

    persistence:
      ## @param rmq.rmqOperator.persistence.storageClassName Storage class name for rabbitmq data PV
      ## REQUIRED
      ##
      storageClassName: ""

      ## @param rmq.rmqOperator.persistence.size Size of persistent volume for rabbitmq data
      ##
      size: 10Gi

    ## @param rmq.rmqOperator.envConfig Additional rabbitmq environment variable settings
    ## See:
    ##   https://www.rabbitmq.com/kubernetes/operator/using-operator#env-config
    ##   https://www.rabbitmq.com/docs/configure#customise-environment
    ## Example:
    ##   envConfig:
    ##     RABBITMQ_USE_LONGNAME: "true"
    envConfig: {}

    ## Additional rabbitmq configuration settings
    ## See:
    ##   https://www.rabbitmq.com/docs/configure#config-items
    ##   https://www.rabbitmq.com/docs/production-checklist
    ##   https://github.com/rabbitmq/cluster-operator/tree/main/docs/examples/production-ready
    ##
    additionalConfig:
      ## @param rmq.rmqOperator.additionalConfig.disk_free_limit.relative set_disk_free_limit mem_relative
      ## Limit relative to the total amount available RAM as a non-negative floating point number.
      ## Values lower than 1.0 can be dangerous and should be used carefully
      ## See:
      ##   https://www.rabbitmq.com/docs/production-checklist#resource-limits-disk-space
      ##   https://www.rabbitmq.com/docs/configure#config-items
      ##   https://www.rabbitmq.com/docs/man/rabbitmqctl.8#set_disk_free_limit~2
      ##
      disk_free_limit.relative: "1.0"
