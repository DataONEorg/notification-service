## Default values for notification-service.
## This is a YAML-formatted file.
##
##     * * *   NOTE: SOME VALUES INCLUDE THE PLACEHOLDER "${RELEASE_NAME}",   * * *
##     * * *         WHICH MUST BE REPLACED BY THE ACTUAL RELEASE NAME        * * *
##
## Make sure you're in the correct k8s context, then:
##  $  helm upgrade --install ns -n notify -f values-dev-cluster-notifications.yaml \
##         oci://ghcr.io/dataone/charts/notification-service --version [version] \
##             --debug --render-subchart-notes
##

## @section Application-Specific Properties for notification-service
##
ns:
  ## @param ns.logLevel The log level for the notification service.
  ## (trace, debug, info, warn, error, fatal)
  logLevel: warn

  ## @param ns.auth.api.baseUrl The base URL for the authentication API (typically the CN)
  ## @param ns.auth.api.authenticate The endpoint for authentication (CN uses '/diag/subject')
  ## @param ns.auth.api.userAgent The User-Agent string to use when making requests to the auth API
  ## @param ns.auth.api.connectTimeoutMilliSec Timeout limit for opening connection to the auth API
  ## @param ns.auth.api.readTimeoutMilliSec Timeout limit for reading data from the auth API
  ##
  auth:
    api:
      baseUrl: https://cn.dataone.org/cn/v2
      authenticate: /diag/subject
      userAgent: "DataONE notification-service/1.0"
      connectTimeoutMilliSec: 5000
      readTimeoutMilliSec: 5000

  database:
    ## @param ns.database.dbName The name of the database used by the notification service.
    ##
    dbName: notifications

    ## @param ns.database.existingSecret (REQUIRED) Basic Auth Secret name for DB username & password
    ##
    existingSecret: "nsdb-cnpg-app"

    ## @param ns.database.jdbcHost (REQUIRED) database connection hostname (postgresql k8s service)
    ## Typically <cnpg-release-name>-cnpg-rw
    ##
    jdbcHost: "nsdb-cnpg-rw"

    ## @param ns.database.jdbcPort The port for the database connection.
    ## This is used by the application to connect to the database.
    ##
    jdbcPort: 5432

## @param replicaCount The number of replicas for the notification web-api service deployment.
##
replicaCount: 1

image:
  ## @param image.repository image repository
  ##
  repository: ghcr.io/dataoneorg/notification-service

  ## @param image.pullPolicy image pull policy
  ##
  pullPolicy: IfNotPresent

  ## @param image.tag Overrides the image tag. Will default to the chart appVersion if set to ""
  ##
  tag: ""


## This section builds out the service account more information can be found here:
##   https://kubernetes.io/docs/concepts/security/service-accounts/ServiceAccount
## @param serviceAccount.create Should a service account be created to run notifications?
## @param serviceAccount.annotations Annotations to add to the service account
## @param serviceAccount.name The name to use for the service account.
##        If not set, and 'create' is 'true', a name is generated using the 'fullname' template
##
serviceAccount:
  create: false
  annotations: {}
  name: ""

## @param podAnnotations Annotations to add to the pod
## see: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
##
podAnnotations: {}

## @param podLabels Labels to add to the pod
## see: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
##
podLabels: {}

## @param podSecurityContext Security context for the pod
## see: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
##
podSecurityContext: {}
  # fsGroup: 2000

## @param securityContext Security context for the container
## see: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
##
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

## This block is for setting up the ingress for more information can be found here:
## https://kubernetes.io/docs/concepts/services-networking/ingress/
## Ingress is a collection of rules that allow inbound connections to reach the endpoints defined
## by a backend. An Ingress can be configured to give services externally-reachable urls, load
## balance traffic, terminate SSL, offer name based virtual hosting etc.
##
ingress:
  ## @param ingress.enabled Enable or disable the ingress
  ##
  enabled: true

  ## @param ingress.className ClassName of the ingress provider in your cluster
  ##  Inspect available classes in your cluster using:    $ kubectl get ingressclasses
  ##
  className: "traefik"

  ## @param ingress.annotations [object] Annotations to add to the ingress;
  ## e.g. to use cert-manager to automatically issue TLS certificates for  the ingress hosts, you
  ## can add the following:
  ##
  ## ingress:
  ##   annotations:
  ##     cert-manager.io/cluster-issuer: "letsencrypt-prod"
  ##
  annotations: {}

  ## @param ingress.corsEnabled Enable or disable CORS functionality for the ingress
  ##
  corsEnabled: true

  ## List of hosts to be used for the ingress
  ## Each host must have a path defined, and the pathType must be set to either
  ## 'ImplementationSpecific', 'Exact', or 'Prefix'; e.g:
  ##   hosts:
  ##     - host: &hostname notifications.test.dataone.org
  ##       paths:
  ##         - path: /
  ##           pathType: Prefix
  hosts:
      ## @param ingress.hosts[0].host The hostname for the ingress
    - host: localhost
      paths:
          ## @param ingress.hosts[0].paths[0].path The path for the ingress host
        - path: /
          ## @param ingress.hosts[0].paths[0].pathType The path type for the ingress host
          pathType: Prefix
        ## send requests for private paths to a dummy service that returns
        ## "503 Service Unavailable", so that external users cannot access them
          ## @param ingress.hosts[0].paths[1].path The path for the ingress host
        - path: /notifications/v1/private
            ## @param ingress.hosts[0].paths[1].pathType The path type for the ingress host
          pathType: Prefix
          backend:
            ## @param ingress.hosts[0].paths[1].backend.serviceName The service name for the backend
            serviceName: dev-null-service
            ## @param ingress.hosts[0].paths[1].backend.servicePort The service port for the backend
            servicePort: 8080

  ## @param ingress.tls List of TLS configurations for the ingress
  ## Each TLS configuration must have a secretName defined, and the hosts must match the
  ## hosts defined in the ingress.hosts section. For example:
  ##   tls:
  ##     - hosts:
  ##         - *hostname
  ##       secretName: ingress-nginx-tls-cert
  tls: []

## Startup Probe
## Liveness and readiness probes are disabled until the startupProbe passes.
## If the startupProbe fails more than 'failureThreshold' times, the container is restarted.
##
## @param startupProbe.enabled Enable readinessProbe for notifications container
## @param startupProbe.enabled Enable startupProbe for the notifications container
## @param startupProbe.httpGet.path The url path to probe during startup
## @param startupProbe.httpGet.port The containerPort to probe
## @param startupProbe.successThreshold Min consecutive successes for probe to be successful
## @param startupProbe.failureThreshold No. of consecutive failures before the container restarted
## @param startupProbe.periodSeconds Interval (in seconds) between startup checks
## @param startupProbe.timeoutSeconds Timeout (in seconds) for each startup check
##
startupProbe:
  enabled: true
  httpGet:
    path: /
    port: 8080
  periodSeconds: 2
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 75

## Liveness Probe
## Periodic probe of container service liveness. If the probe fails, container will be restarted
##
## @param livenessProbe.enabled Enable livenessProbe for notifications container
## @param livenessProbe.httpGet.path The url path to probe.
## @param livenessProbe.httpGet.port The named containerPort to probe
## @param livenessProbe.periodSeconds Period seconds for readinessProbe
## @param livenessProbe.timeoutSeconds Timeout seconds for readinessProbe
## @param livenessProbe.successThreshold Min consecutive successes for probe to be successful
## @param livenessProbe.failureThreshold No. consecutive failures before container marked unhealthy
##
livenessProbe:
  enabled: true
  httpGet:
    path: /notifications/v1/metrics/ping
    port: http
  periodSeconds: 1
  timeoutSeconds: 5
  failureThreshold: 100
  successThreshold: 1

## Readiness Probe
## Periodic probe of container service readiness. If the probe fails, container will be removed
## from service endpoints (but will not be restarted unless livenessProbe fails)
##
## @param readinessProbe.enabled Enable readinessProbe for notifications container
## @param readinessProbe.httpGet.path The url path to probe.
## @param readinessProbe.httpGet.port The named containerPort to probe
## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
## @param readinessProbe.periodSeconds Period seconds for readinessProbe
## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
## @param readinessProbe.successThreshold Min consecutive successes for probe to be successful
## @param readinessProbe.failureThreshold No. consecutive failures before container marked unhealthy
##
readinessProbe:
  enabled: true
  httpGet:
    path: /notifications/v1/metrics/ping
    port: http
  initialDelaySeconds: 5
  periodSeconds: 1
  timeoutSeconds: 5
  failureThreshold: 50
  successThreshold: 1

## CURRENTLY IGNORED - NEEDS METRICS SERVICE ENABLED ON CLUSTER
## This section is for setting up autoscaling. More information can be found here:
## https://kubernetes.io/docs/concepts/workloads/autoscaling/
