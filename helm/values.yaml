  maxReplicas: 10   # CURRENTLY IGNORED - NEEDS METRICS SERVICE ON CLUSTER
  targetCPUUtilizationPercentage: 80    # CURRENTLY IGNORED - NEEDS METRICS SERVICE ON CLUSTER
  targetMemoryUtilizationPercentage: 80 # CURRENTLY IGNORED - NEEDS METRICS SERVICE ON CLUSTER

