ns:
  auth:
    api:
      baseUrl: {{ .Values.ns.auth.api.baseUrl | default "https://cn-sandbox.test.dataone.org/cn/v2" }}
      authenticate: {{ .Values.ns.auth.api.authenticate | default "/diag/subject" }}
      userAgent: {{ .Values.ns.auth.api.userAgent | default "DataONE notification-service/1.0" }}
  database:
    name: {{ .Values.ns.database.dbName | default "notifications" }}
    jdbcHost: {{ required "ns.database.jdbcHost IS REQUIRED" .Values.ns.database.jdbcHost }}
    jdbcPort: {{ default "5432" .Values.ns.database.jdbcPort | quote }}
    ##  See HikariCP configuration options at:
    ##  https://github.com/brettwooldridge/HikariCP?tab=readme-ov-file#gear-configuration-knobs-baby
    driverClassName: "org.postgresql.Driver"
  messaging:
    rabbitmq:
      enabled: true
      host: {{ required "rmq.rmqConnection.hostname IS REQUIRED" .Values.rmq.rmqConnection.hostname }}
      port: {{ default 5672 .Values.rmq.rmqConnection.port | quote }}
      virtualHost: {{ default "/" .Values.rmq.rmqConnection.virtualHost | quote }}
      queueName: {{ required "rmq.rmqConnection.queueName IS REQUIRED" .Values.rmq.rmqConnection.queueName }}
      prefetchCount: {{ default 25 .Values.rmq.rmqConnection.prefetchCount | quote }}
