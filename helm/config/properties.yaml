ns:
  api:
    privateBaseUrl: {{ include "notifications.private.api.url" . }}
  source:
    {{- if hasKey .Values.nssource.eventsources "dataset" }}
    {{- $_ := required "nssource.eventsources.dataset.solrQueryUrl IS REQUIRED" .Values.nssource.eventsources.dataset.solrQueryUrl }}
    {{- end }}
    eventsources:
      {{- toYaml .Values.nssource.eventsources | nindent 6 }}
  auth:
    api:
      baseUrl: {{ .Values.ns.auth.api.baseUrl | default "https://cn-sandbox.test.dataone.org/cn/v2" }}
      authenticate: {{ .Values.ns.auth.api.authenticate | default "/diag/subject" }}
      userAgent: {{ .Values.ns.auth.api.userAgent | default "DataONE notification-service/1.0" }}
      connectTimeoutMilliSec: {{ .Values.ns.auth.api.connectTimeoutMilliSec | default "5000" }}
      readTimeoutMilliSec: {{ .Values.ns.auth.api.readTimeoutMilliSec | default "5000" }}
  database:
    name: {{ .Values.ns.database.dbName | default "notifications" }}
    jdbcHost: {{ required "ns.database.jdbcHost IS REQUIRED" .Values.ns.database.jdbcHost }}
    jdbcPort: {{ default "5432" .Values.ns.database.jdbcPort | quote }}
    ##  See HikariCP configuration options at:
    ##  https://github.com/brettwooldridge/HikariCP?tab=readme-ov-file#gear-configuration-knobs-baby
    driverClassName: "org.postgresql.Driver"
  messaging:
    rabbitmq:
      enabled: true
      host: {{ required "rmq.rmqConnection.hostname IS REQUIRED" .Values.rmq.rmqConnection.hostname }}
      port: {{ default 5672 .Values.rmq.rmqConnection.port | quote }}
      virtualHost: {{ default "/" .Values.rmq.rmqConnection.virtualHost | quote }}
      queueName: {{ required "rmq.rmqConnection.queueName IS REQUIRED" .Values.rmq.rmqConnection.queueName }}
      prefetchCount: {{ default 25 .Values.rmq.rmqConnection.prefetchCount | quote }}
    notifiers:
      email:
        className: {{ .Values.nsconsumer.notifiers.email.className }}
        host: {{ .Values.nsconsumer.notifiers.email.host | default "localhost" }}
        port: {{ .Values.nsconsumer.notifiers.email.port | default 1025 }}
        fromName: {{ .Values.nsconsumer.notifiers.email.fromName | default "DataONE Notification Service" }}
        fromAddress: {{ .Values.nsconsumer.notifiers.email.fromAddress | default "do-not-reply@dataone.org" }}
        subject: {{ .Values.nsconsumer.notifiers.email.subject | default "DataONE Notification" }}
        accountSvc:
          url: {{ .Values.nsconsumer.notifiers.email.accountSvc.url }}
          userAgent: {{ .Values.nsconsumer.notifiers.email.accountSvc.userAgent }}
          connectTimeoutSec: {{ .Values.nsconsumer.notifiers.email.accountSvc.connectTimeoutSec }}
