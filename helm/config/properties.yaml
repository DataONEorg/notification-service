ns:
  auth:
    api:
      baseUrl: {{ .Values.ns.auth.api.baseUrl | default "https://cn-sandbox.test.dataone.org/cn/v2" }}
      authenticate: {{ .Values.ns.auth.api.authenticate | default "/diag/subject" }}
      userAgent: {{ .Values.ns.auth.api.userAgent | default "DataONE notification-service/1.0" }}
  database:
    name: {{ .Values.ns.database.dbName | default "notifications" }}
    jdbcHost: {{ required "ns.database.jdbcHost IS REQUIRED" .Values.ns.database.jdbcHost }}
    jdbcPort: {{ default "5432" .Values.ns.database.jdbcPort | quote }}
    ##  See HikariCP configuration options at:
    ##  https://github.com/brettwooldridge/HikariCP?tab=readme-ov-file#gear-configuration-knobs-baby
    driverClassName: "org.postgresql.Driver"

rabbitmq:
  enabled: {{ .Values.rabbitmq.enabled | default true }}
## NEED TO DEFINE:
  host: {{ required "rabbitmq.host IS REQUIRED" .Values.rabbitmq.host }}
  port: {{ default 5672 .Values.rabbitmq.port | quote }}
  username: {{ required "rabbitmq.username IS REQUIRED" .Values.rabbitmq.username }}
  password: {{ required "rabbitmq.password IS REQUIRED" .Values.rabbitmq.password }}
  virtualHost: {{ default "/" .Values.rabbitmq.virtualHost | quote }}
  queueName: {{ required "rabbitmq.queueName IS REQUIRED" .Values.rabbitmq.queueName }}
  prefetchCount: {{ default 25 .Values.rabbitmq.prefetchCount | quote }}
  connectionName: {{ default "notifications-consumer" .Values.rabbitmq.connectionName | quote }}
  requeueOnError: {{ default false .Values.rabbitmq.requeueOnError | quote }}
