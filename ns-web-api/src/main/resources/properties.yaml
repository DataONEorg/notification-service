############################################
## Properties for NON-K8S deployments
## (see helm/config/properties.yaml for K8S)
############################################
##
ns:
  auth:
    api:
      baseUrl: https://cn-sandbox.test.dataone.org/cn/v2
      authenticate: /diag/subject
      userAgent: "DataONE notification-service/1.0"
  database:
    username: notifications_user
    # Change this to your own password!
    password: YOUR-PASSWORD-HERE
    name: notifications
    jdbcHost: localhost
    jdbcPort: 5432
    ##  See HikariCP configuration options at:
    ##  https://github.com/brettwooldridge/HikariCP?tab=readme-ov-file#gear-configuration-knobs-baby
    driverClassName: org.postgresql.Driver
  messaging:
    rabbitmq:
      enabled: true
      host: localhost
      port: 5672
      username: guest
      password: guest
      virtualHost: /
      queueName: notification.subscription.events
      prefetchCount: 25
      connectionName: notification-service-consumer
      requeueOnError: false
