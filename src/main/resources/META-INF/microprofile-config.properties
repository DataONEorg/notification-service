# This configuration file sets up the MicroProfile OpenAPI implementation
# to generate the OpenAPI documentation for the DataONE Notifications Service.


# This property sets the server URL that will appear in the generated OpenAPI
# document. Adjust this to match your deployment environment.
# The value should be the base path where your JAX-RS application is hosted.
# For example, if your application is hosted at http://example.com/notifications,
# then set the server URL to /notifications.
#
mp.openapi.servers=/notifications

# This property overrides the default endpoint path to avoid collision with
# application resources. The path is relative to the context root, ignoring
# the JAX-RS ApplicationPath.
#
# mp.openapi.path=/api-docs/openapi

# This property explicitly lists the packages that the OpenAPI implementation
# should scan for JAX-RS and OpenAPI annotations. This is the most reliable way
# to ensure your resources are found.
#
mp.openapi.scan.packages=org.dataone.notifications.api,\
  org.dataone.notifications.api.resource,\
  org.dataone.notifications.api.metrics

# This property ensures that the OpenAPI document is generated even if no JAX-RS
# Application class is found. While you have one, this can help in environments
# where scanning might be inconsistent.
#
mp.openapi.scan.disable=false
