Configuration:
  monitorInterval: 30  # seconds

  status: warn

  Appenders:
    Console:
      name: Console
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "notification-service %d{yyyyMMdd-HH:mm:ss}: [%p]: %m [%C:%M:%L]%n"

  Loggers:
    # Root log level defaults to DEBUG. Override from the command line if needed, using
    # '-DLOG_LEVEL='; e.g.:
    #
    #   mvn verify -DLOG_LEVEL=warn
    #
    Root:
      level: ${sys:LOG_LEVEL:-debug}
      AppenderRef:
        ref: Console

    Logger:
      - name: org.jboss
        level: error
        additivity: false
        AppenderRef:
          ref: Console

      - name: com.github.dockerjava
        level: warn
        additivity: false
        AppenderRef:
          ref: Console

      - name: com.github.dockerjava.zerodep
        level: warn
        additivity: false
        AppenderRef:
          ref: Console

      - name: org.testcontainers.utility.RyukResourceReaper
        level: error
        additivity: false
        AppenderRef:
          ref: Console

      - name: com.zaxxer.hikari.pool
        level: error
        additivity: false
        AppenderRef:
          ref: Console

      # ↓ these control http logging output from Rest Assured. Defaults to ERROR. Override from
      #   the command line if needed, using '-DLOG_LEVEL='; e.g.:
      #
      #   mvn verify -DLOG_LEVEL=warn mvn -PsmokeTest \
      #     -DBASE_URL="$BASE_URL" -DTOKEN="$TOKEN"
      #

      - name: io.restassured
        level: ${sys:LOG_LEVEL:-warn}
        additivity: false
        AppenderRef: { ref: Console }

      - name: org.apache.http
        level: ${sys:LOG_LEVEL:-warn}
        additivity: false
        AppenderRef:
          ref: Console

      - name: org.apache.http.wire
        level: ${sys:LOG_LEVEL:-warn}
        additivity: false
        AppenderRef:
          ref: Console
