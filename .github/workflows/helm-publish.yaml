# This workflow will update helm dependencies and then package and publish the Helm chart to the
# GitHub Container Registry (ghcr.io).
name: Helm Publish

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  helm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Update Helm dependencies
        run: helm dependency update helm/

      - name: Package Helm chart
        run: helm package helm/ --destination .

      - name: Push Helm chart to GHCR
        run: helm push notifications-${{ inputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
