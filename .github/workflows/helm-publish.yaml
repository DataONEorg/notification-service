# This workflow will update helm dependencies and then package and publish the Helm chart to the
# GitHub Container Registry (ghcr.io).
name: Helm Publish

on:
  workflow_call:
    secrets:
      GITHUB_TOKEN:
        required: true
#      GHCR_PAT:
#        required: true
#      GHCR_USR:
#        required: true

jobs:
  helm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
#        run: echo "${{ secrets.GHCR_PAT }}" | helm registry login ghcr.io --username ${{ secrets.GHCR_USR }} --password-stdin
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Update Helm dependencies
        run: helm dependency update helm/

      - name: Read Helm chart version
        id: chart
        run: |
          version=$(grep '^version:' helm/Chart.yaml | awk '{ print $2 }')
          echo "chart_version=$version" >> $GITHUB_OUTPUT

      - name: Package Helm chart
        run: helm package helm/ --destination .

      - name: Debug token scope
        run: |
          curl -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               https://ghcr.io/v2/dataoneorg/charts/tags/list
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Org: ${{ github.repository_owner }}"

      - name: Push Helm chart to GHCR
        run: |
          export HELM_EXPERIMENTAL_OCI=1
          helm push notifications-${{ steps.chart.outputs.chart_version }}.tgz oci://ghcr.io/dataoneorg/charts
