# This workflow will update helm dependencies and then package and publish the Helm chart to the
# GitHub Container Registry (ghcr.io).
name: Helm Publish

on:
  workflow_call:

jobs:
  helm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read Helm chart version
        id: chart
        run: |
          version=$(grep '^version:' helm/Chart.yaml | awk '{ print $2 }')
          echo "chart_version=$version" >> $GITHUB_OUTPUT

      - name: Validate chart version
        run: |
          version="${{ steps.chart.outputs.chart_version }}"
          ref="${{ github.ref }}"
          ref_name="${{ github.ref_name }}"

          echo "Chart version: $version"
          echo "GitHub ref: $ref"

          if [[ "$ref_name" == "develop" ]]; then
            if [[ ! "$version" =~ ^0\.[0-9]+\.[0-9]+$ && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "❌ ERROR: On 'develop', chart version ($version) must start with 0.x.y or include a suffix (e.g. 1.2.3-develop)"
          exit 1
          fi
          fi

          if [[ "$ref" =~ ^refs/tags/chart-(.+)$ ]]; then
            tag_version="${BASH_REMATCH[1]}"
            if [[ "$version" != "$tag_version" ]]; then
              echo "❌ ERROR: Chart version ($version) does not match tag version (chart-$tag_version)"
              exit 1
            fi
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Update Helm dependencies
        run: helm dependency update helm/

      - name: Package Helm chart
        run: helm package helm/ --destination .

      - name: Push Helm chart to GHCR
        run: |
          export HELM_EXPERIMENTAL_OCI=1
          helm push notifications-${{ steps.chart.outputs.chart_version }}.tgz oci://ghcr.io/dataoneorg/charts
