# This workflow will use Maven to build and run unit and integration tests, and will cache/restore
# any dependencies to improve the workflow execution time. For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven
name: Java CI with Maven

on:
  # Trigger this workflow from a top-level orchestration workflow
  workflow_call:
    outputs:
      version:
        description: "Version from Maven build"
        value: ${{ jobs.maven-build.outputs.version }}

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository_owner }}/notification-service

jobs:
  maven-build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Extract Maven project version
      run: |
        echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT
      id: get_version
    - name: Build and Test
      id: build-and-test
      run: mvn --batch-mode --update-snapshots test
      continue-on-error: true
    - name: Upload test logs if tests failed
      if: steps.build-and-test.outcome != 'success'
      uses: actions/upload-artifact@v6
      with:
        name: surefire-reports
        path: target/surefire-reports/
    - name: Fail build if tests failed
      if: steps.build-and-test.outcome != 'success'
      run: exit 1
    - name: Integration Tests
      id: integration-tests
      run: mvn --batch-mode --update-snapshots verify -DskipTests=true
      continue-on-error: true
    - name: Upload test logs if tests failed
      if: steps.integration-tests.outcome != 'success'
      uses: actions/upload-artifact@v6
      with:
        name: failsafe-reports
        path: target/failsafe-reports/
    - name: Fail build if tests failed
      if: steps.integration-tests.outcome != 'success'
      run: exit 1
    - name: Package
      run: |
        mvn --batch-mode --update-snapshots -DskipTests=true package
    - uses: actions/cache@v5
      with:
        path: .
        key: builddir-${{ github.run_id }}
      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@v5
