name: CI - rmq-consumer

on:
  # Trigger this workflow from a top-level orchestration workflow
  workflow_call:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set IMAGE tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=${GITHUB_SHA}
          fi
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/notifications-consumer:${TAG}" >> 
          $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and package module
        run: mvn -B -pl rmq-consumer -am -DskipTests package

      - name: Publish image to GHCR using JIB
        env:
          JIB_USERNAME: ${{ github.actor }}
          JIB_PASSWORD: ${{ secrets.GHCR_TOKEN }}
        run: |
          mvn -pl rmq-consumer -am -DskipTests com.google.cloud.tools:jib-maven-plugin:build \
            -Djib.to.image=${IMAGE} \
            -Djib.to.auth.username=${JIB_USERNAME} \
            -Djib.to.auth.password=${JIB_PASSWORD}
