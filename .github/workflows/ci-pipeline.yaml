# This is the main file that defines the CI pipeline for the project using GitHub Actions.
name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "develop"
      - "feature-*"
      - "bugfix-*"
    tags:
      - '*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      helm_changed: ${{ steps.detect.outputs.helm_changed }}
      non_helm_changed: ${{ steps.detect.outputs.non_helm_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Fetch enough history so prev. commit will be found

      - name: Detect changes in helm/ and outside helm/
        id: detect
        run: |
          if git diff --quiet ${{ github.event.before }} ${{ github.sha }} -- helm/; then
            echo "helm_changed=false" >> $GITHUB_OUTPUT
          else
            echo "helm_changed=true" >> $GITHUB_OUTPUT
          fi

          if git diff --quiet ${{ github.event.before }} ${{ github.sha }} -- . ':!helm/'; then
            echo "non_helm_changed=false" >> $GITHUB_OUTPUT
          else
            echo "non_helm_changed=true" >> $GITHUB_OUTPUT
          fi

  maven-build:
    uses: ./.github/workflows/maven-build.yaml
    needs: [detect-changes]
    # Don't need to run maven-build if these are helm-only changes
    if: needs.detect-changes.outputs.non_helm_changed == 'true'

  docker-publish:
    uses: ./.github/workflows/docker-publish.yaml
    needs: [maven-build, detect-changes]
    # Don't need to run docker-publish if these are helm-only changes
    if: needs.detect-changes.outputs.non_helm_changed == 'true' && (github.ref_name == 'develop' || startsWith(github.ref, 'refs/tags/'))
    with:
      version: ${{ needs.maven-build.outputs.version }}

#  helm-publish:
#    uses: ./.github/workflows/helm-publish.yaml  secrets:
#    secrets:
#      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
##      GHCR_PAT: ${{ secrets.GHCR_PAT }}
##      GHCR_USR: ${{ secrets.GHCR_USR }}
#    needs: [detect-changes]
#    # Don't need to run helm-publish if there are no helm changes
#    if: needs.detect-changes.outputs.helm_changed == 'true' && (github.ref_name == 'develop' || startsWith(github.ref, 'refs/tags/'))

  helm-publish:
    needs: [detect-changes]
    # Don't need to run helm-publish if there are no helm changes
    if: needs.detect-changes.outputs.helm_changed == 'true' && (github.ref_name == 'develop' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        #        run: echo "${{ secrets.GHCR_PAT }}" | helm registry login ghcr.io --username ${{ secrets.GHCR_USR }} --password-stdin
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Update Helm dependencies
        run: helm dependency update helm/

      - name: Read Helm chart version
        id: chart
        run: |
          version=$(grep '^version:' helm/Chart.yaml | awk '{ print $2 }')
          echo "chart_version=$version" >> $GITHUB_OUTPUT

      - name: Package Helm chart
        run: helm package helm/ --destination .

      - name: Debug token scope
        run: |
          curl -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               https://ghcr.io/v2/dataoneorg/charts/tags/list
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Org: ${{ github.repository_owner }}"

      - name: Push Helm chart to GHCR
        run: |
          export HELM_EXPERIMENTAL_OCI=1
          helm push notifications-${{ steps.chart.outputs.chart_version }}.tgz oci://ghcr.io/dataoneorg/charts
