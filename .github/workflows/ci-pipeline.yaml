# This is the main file that defines the CI pipeline for the project using GitHub Actions.
name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "develop"
      - "feature-*"
      - "task-*"
      - "bugfix-*"
    tags:
      - '*.*.*'

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      helm_changed: ${{ steps.detect.outputs.helm_changed }}
      non_helm_changed: ${{ steps.detect.outputs.non_helm_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history so prev. commit will be found

      - name: Detect changes in helm/ and outside helm/
        id: detect
        run: |
          check_changed() {
            local status=0
            git diff --quiet ${{ github.event.before }} ${{ github.sha }} -- "$@" || status=$?
          
            if [ "$status" -gt 1 ]; then
              echo "git diff failed (exit code $status) for: $*" >&2
              return "$status"
            fi
          
            [ "$status" -eq 1 ]
          }
          
          if check_changed helm/; then
            echo "helm_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "helm_changed=false" >> "$GITHUB_OUTPUT"
          fi
          
          if check_changed . ':!helm/'; then
            echo "non_helm_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "non_helm_changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "detect-changes FINISHED: $(cat $GITHUB_OUTPUT | grep helm_changed)"

  maven-build:
    uses: ./.github/workflows/maven-build.yaml
    needs: [detect-changes]
    # Don't need to run maven-build if these are helm-only changes
    if: needs.detect-changes.outputs.non_helm_changed == 'true'

  docker-publish-web-api:
    uses: ./.github/workflows/docker-publish.yaml
    needs: [maven-build, detect-changes]
    # Run docker-publish for all non-chart tags, or for non-helm code changes
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/chart-') ||
      needs.detect-changes.outputs.non_helm_changed == 'true'
    with:
      version: ${{ needs.maven-build.outputs.version }}
      imageName: notification-service
      dockerFilePath: docker/Dockerfile-web-api

  docker-publish-consumer:
    uses: ./.github/workflows/docker-publish.yaml
    needs: [maven-build, detect-changes]
    # Run docker-publish for all non-chart tags, or for non-helm code changes
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/chart-') ||
      needs.detect-changes.outputs.non_helm_changed == 'true'
    with:
      version: ${{ needs.maven-build.outputs.version }}
      imageName: notification-consumer
      dockerFilePath: docker/Dockerfile-consumer

  helm-publish:
    uses: ./.github/workflows/helm-publish.yaml
    needs: [detect-changes]
    # publish helm chart for all chart-* tags, or for helm code changes
    if: startsWith(github.ref, 'refs/tags/chart-') ||
      needs.detect-changes.outputs.helm_changed == 'true'
